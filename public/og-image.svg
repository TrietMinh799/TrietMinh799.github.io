<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121312" />
      <stop offset="50%" stop-color="#15201d" />
      <stop offset="100%" stop-color="#1c332e" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ebfae" />
      <stop offset="100%" stop-color="#6ee7d5" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Ambient Glow -->
  <circle cx="950" cy="150" r="220" fill="#4ebfae" opacity="0.15" filter="url(#glow)" />
  <circle cx="200" cy="500" r="180" fill="#1e5a52" opacity="0.2" filter="url(#glow)" />

  <!-- Subtle Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="20" fill="none" stroke="#292d29" stroke-width="2" opacity="0.8" />

  <!-- Header Badge -->
  <g transform="translate(90, 100)">
    <rect width="280" height="42" rx="21" fill="#182b28" stroke="#4ebfae" stroke-width="1.5" stroke-opacity="0.4" />
    <circle cx="24" cy="21" r="6" fill="#4ebfae" />
    <text x="42" y="27" fill="#4ebfae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" letter-spacing="0.5">trietminh799.github.io</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(90, 260)">
    <text x="0" y="0" fill="#f0f2f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" letter-spacing="-1.5">
      Triết Minh
    </text>
    <text x="0" y="70" fill="url(#accent)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600">
      Kho lưu trữ vụn vặt &amp; chia sẻ công nghệ
    </text>
    <text x="0" y="130" fill="#8e938e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400">
      Ghi chép về Web Development, Thuật toán, IoT &amp; ESP32 và trải nghiệm đời sống.
    </text>
  </g>

  <!-- Bottom Pills / Tags -->
  <g transform="translate(90, 480)">
    <g transform="translate(0, 0)">
      <rect width="180" height="44" rx="10" fill="#181a18" stroke="#292d29" stroke-width="1.5" />
      <text x="90" y="28" text-anchor="middle" fill="#c8cbc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Web Development</text>
    </g>
    <g transform="translate(200, 0)">
      <rect width="140" height="44" rx="10" fill="#181a18" stroke="#292d29" stroke-width="1.5" />
      <text x="70" y="28" text-anchor="middle" fill="#c8cbc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Algorithms</text>
    </g>
    <g transform="translate(360, 0)">
      <rect width="145" height="44" rx="10" fill="#181a18" stroke="#292d29" stroke-width="1.5" />
      <text x="72" y="28" text-anchor="middle" fill="#c8cbc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">IoT &amp; ESP32</text>
    </g>
    <g transform="translate(525, 0)">
      <rect width="110" height="44" rx="10" fill="#181a18" stroke="#292d29" stroke-width="1.5" />
      <text x="55" y="28" text-anchor="middle" fill="#c8cbc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500">Astro 5</text>
    </g>
  </g>
</svg>
